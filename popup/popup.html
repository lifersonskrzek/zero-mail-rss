<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Zero-Mail RSS</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px; background: #1a1a1a; color: #f0f0f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px; overflow: hidden;
    }
    .header {
      background: #E87722; padding: 9px 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .header-title { color: white; font-size: 12px; font-weight: 500; }
    .header-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }

    /* Botão sino */
    .notif-btn {
      display: flex; align-items: center; justify-content: center;
      width: 26px; height: 26px;
      background: rgba(255,255,255,0.13);
      border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 50%; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
    }
    .notif-btn:hover { background: rgba(255,255,255,0.38); border-color: rgba(255,255,255,0.8); }
    .notif-btn.silenced { background: rgba(0,0,0,0.2); border-color: rgba(255,255,255,0.15); }
    .notif-btn .ico-on  { display: block; }
    .notif-btn .ico-off { display: none;  }
    .notif-btn.silenced .ico-on  { display: none;  }
    .notif-btn.silenced .ico-off { display: block; }

    /* Select idioma */
    .lang-select {
      background: rgba(255,255,255,0.15); border: 0.5px solid rgba(255,255,255,0.35);
      border-radius: 6px; color: white; font-size: 10px;
      padding: 3px 6px; cursor: pointer; outline: none; display: none; max-width: 105px;
    }
    .lang-select option { background: #333; color: white; }

    /* Toggle tradução */
    .toggle-pill {
      display: flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.13); border: 0.5px solid rgba(255,255,255,0.3);
      border-radius: 20px; padding: 4px 10px;
      cursor: pointer; transition: all 0.2s; user-select: none;
    }
    .toggle-pill:hover { background: rgba(255,255,255,0.38); border-color: rgba(255,255,255,0.8); }
    .toggle-pill.on    { background: white; border-color: white; }
    .globe-icon { transition: stroke 0.2s; }
    .toggle-pill.on .globe-icon { stroke: #E87722 !important; }
    .t-track {
      width: 28px; height: 16px; border-radius: 8px;
      background: rgba(255,255,255,0.3);
      display: flex; align-items: center; padding: 0 2px;
      transition: background 0.2s; flex-shrink: 0; overflow: hidden;
    }
    .t-track.on { background: #38A169; }
    .t-thumb {
      width: 12px; height: 12px; border-radius: 50%; background: white;
      flex-shrink: 0; transition: transform 0.2s;
    }
    .t-thumb.on { transform: translateX(12px); }
    .t-label { font-size: 10px; color: white; font-weight: 500; white-space: nowrap; }
    .toggle-pill.on .t-label { color: #E87722; }

    /* Banner detecção */
    #detection-banner {
      display: none; padding: 12px 14px;
      background: #1f1800; border-bottom: 0.5px solid #3a2a00;
    }
    .detect-label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .dot-pulse {
      width: 8px; height: 8px; border-radius: 50%; background: #E87722; flex-shrink: 0;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    .detect-label span {
      font-size: 10px; color: #E87722; font-weight: 500;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .detect-name { font-size: 13px; font-weight: 500; color: #fff; margin-bottom: 2px; }
    .detect-url  { font-size: 11px; color: #888; margin-bottom: 10px; word-break: break-all; }
    .detect-buttons { display: flex; gap: 8px; }
    .btn-assinar {
      flex: 1; background: #E87722; color: white; border: none;
      border-radius: 6px; padding: 8px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-assinar:hover { background: #cf6b18; }
    .btn-ignorar {
      flex: 1; background: transparent; color: #888; border: 0.5px solid #444;
      border-radius: 6px; padding: 8px; font-size: 11px; cursor: pointer;
    }
    .btn-ignorar:hover { background: #242424; color: #bbb; }

    /* Tabs */
    .tabs { display: flex; background: #141414; border-bottom: 0.5px solid #2a2a2a; }
    .tab-btn {
      flex: 1; padding: 8px; font-size: 11px; color: #666;
      background: transparent; border: none; cursor: pointer;
      border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .tab-btn:hover { color: #aaa; }
    .tab-btn.active { color: #E87722; border-bottom-color: #E87722; }

    /* Main content */
    #main-content { height: 300px; overflow: hidden; }
    .dashboard { display: flex; height: 300px; }

    /* Coluna fontes */
    .sources-col {
      width: 125px; flex-shrink: 0;
      border-right: 0.5px solid #2a2a2a; overflow-y: auto; background: #161616;
    }
    .source-label {
      padding: 7px 10px 3px; font-size: 9px; color: #444;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .source-item {
      display: flex; align-items: center; gap: 6px; padding: 7px 10px;
      cursor: pointer; transition: background 0.1s; border-left: 2px solid transparent;
    }
    .source-item:hover { background: #1f1f1f; }
    .source-item.active { background: #1f1500; border-left-color: #E87722; }
    .source-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .source-name { font-size: 11px; color: #ccc; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .source-item.active .source-name { color: #E87722; font-weight: 500; }
    .unread-badge { font-size: 9px; border-radius: 8px; padding: 1px 5px; flex-shrink: 0; background: #3a2000; color: #E87722; }

    /* Coluna artigos */
    .articles-col { flex: 1; overflow-y: auto; background: #1a1a1a; }
    .article-row { padding: 9px 12px; border-bottom: 0.5px solid #222; cursor: pointer; transition: background 0.1s; }
    .article-row:hover { background: #202020; }
    .article-row.read .article-title { color: #4a4a4a; }
    .article-meta { display: flex; align-items: center; gap: 5px; margin-bottom: 3px; }
    .article-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .article-src  { font-size: 10px; font-weight: 500; }
    .article-time { font-size: 10px; color: #555; margin-left: auto; white-space: nowrap; }
    .article-title { font-size: 12px; color: #dddddd; line-height: 1.45; transition: color 0.2s, opacity 0.2s; }

    /* Estados */
    .loading-state, .empty-articles, .empty-state {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 100%; gap: 10px;
      color: #555; font-size: 12px; text-align: center; padding: 20px;
    }
    .spinner { width: 20px; height: 20px; border: 2px solid #333; border-top-color: #E87722; border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn-refresh { background: transparent; border: 0.5px solid #444; border-radius: 6px; color: #777; padding: 5px 12px; font-size: 11px; cursor: pointer; }
    .btn-refresh:hover { background: #242424; color: #ccc; }
    .empty-title { font-size: 13px; color: #bbb; }
    .empty-sub   { font-size: 11px; color: #555; line-height: 1.6; }

    /* Gerenciar */
    .manage-list { overflow-y: auto; max-height: 272px; }
    .manage-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid #222; transition: background 0.1s; }
    .manage-row:hover { background: #202020; }
    .manage-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .manage-info { flex: 1; min-width: 0; }
    .manage-name { font-size: 12px; color: #dddddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .manage-url  { font-size: 10px; color: #555; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .btn-remove { opacity: 0; border: 0.5px solid #E53E3E; background: transparent; color: #E53E3E; border-radius: 6px; padding: 3px 8px; font-size: 10px; cursor: pointer; flex-shrink: 0; transition: opacity 0.15s; white-space: nowrap; }
    .manage-row:hover .btn-remove { opacity: 1; }
    .manage-hint { padding: 7px 14px; font-size: 10px; color: #3a3a3a; border-top: 0.5px solid #222; }

    /* Toast */
    .toast { position: fixed; bottom: 36px; left: 50%; transform: translateX(-50%); background: #38A169; color: white; font-size: 11px; padding: 5px 14px; border-radius: 20px; opacity: 0; transition: opacity 0.25s; pointer-events: none; white-space: nowrap; }
    .toast.show { opacity: 1; }

    /* Footer */
    .footer { padding: 7px 12px; border-top: 0.5px solid #2a2a2a; background: #141414; display: flex; align-items: center; gap: 5px; }
    .footer span { font-size: 10px; color: #E87722; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <div class="header">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="white">
      <path d="M6.18 15.64a2.18 2.18 0 1 1 0 4.36 2.18 2.18 0 0 1 0-4.36
               M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44
               m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1z"/>
    </svg>
    <span class="header-title">Zero-Mail RSS</span>

    <div class="header-right">

      <!-- BOTÃO SINO -->
      <div class="notif-btn" id="notif-btn" title="Silenciar notificações">
        <!-- Sino ativo (🔔) -->
        <svg class="ico-on" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
        <!-- Sino silenciado (🔕) -->
        <svg class="ico-off" width="13" height="13" viewBox="0 0 24 24"
             fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
      </div>

      <!-- SELECT IDIOMA + TOGGLE TRADUÇÃO -->
      <select class="lang-select" id="lang-select">
        <option value="pt">Português</option>
        <option value="es">Español</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
        <option value="de">Deutsch</option>
        <option value="it">Italiano</option>
        <option value="ja">日本語</option>
        <option value="zh-CN">中文</option>
        <option value="ko">한국어</option>
        <option value="ru">Русский</option>
        <option value="ar">العربية</option>
        <option value="hi">हिन्दी</option>
      </select>

      <div class="toggle-pill" id="translate-toggle">
        <svg class="globe-icon" width="11" height="11" viewBox="0 0 24 24"
             fill="none" stroke="white" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10
                   15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
        <div class="t-track" id="translate-track">
          <div class="t-thumb" id="translate-thumb"></div>
        </div>
        <span class="t-label" id="translate-label">Traduzir</span>
      </div>

    </div>
  </div>

  <!-- BANNER DE DETECÇÃO -->
  <div id="detection-banner">
    <div class="detect-label">
      <div class="dot-pulse"></div>
      <span>Feed detectado nesta página</span>
    </div>
    <div class="detect-name" id="detect-name"></div>
    <div class="detect-url"  id="detect-url"></div>
    <div class="detect-buttons">
      <button class="btn-assinar" id="btn-assinar">＋ Assinar agora</button>
      <button class="btn-ignorar" id="btn-ignorar">Ignorar este domínio</button>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab-btn active" id="tab-articles">Artigos</button>
    <button class="tab-btn" id="tab-manage">Gerenciar assinaturas</button>
  </div>

  <!-- MAIN CONTENT -->
  <div id="main-content"></div>

  <!-- FOOTER -->
  <div class="footer">
    <svg width="10" height="10" viewBox="0 0 24 24" fill="#555">
      <path d="M12 2a10 10 0 1 0 0 20A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 0-16
               8 8 0 0 1 0 16zm-1-5h2v2h-2zm0-8h2v6h-2z"/>
    </svg>
    <span id="footer-text">Carregando…</span>
  </div>

  <div class="toast" id="toast"></div>

  <script src="rss-parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
